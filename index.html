<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Link.net - Rút gọn link kiếm tiền</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #080d14; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 400px; background: #0f1722; padding: 30px; border-radius: 20px; border: 1px solid #1e293b; text-align: center; }
        h1 { color: #00e5ff; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #1e293b; background: #0a0f18; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 15px; border-radius: 10px; border: none; background: #00e5ff; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; display: none; background: #1a2432; padding: 15px; border-radius: 10px; border: 1px dashed #00e5ff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Link.net</h1>
        <input type="text" id="longUrl" placeholder="Dán link gốc vào đây...">
        <button onclick="shorten()">RÚT GỌN NGAY</button>
        <div id="res" class="result">
            <div style="font-size: 0.8rem; color: #94a3b8;">Link của bạn:</div>
            <b id="shortLink" style="color: #00e5ff;"></b>
        </div>
    </div>
    <script>
        async function shorten() {
            const longUrl = document.getElementById('longUrl').value;
            const response = await fetch('/api/shorten', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ longUrl })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById('res').style.display = 'block';
                document.getElementById('shortLink').innerText = data.shortUrl;
            }
        }
    </script>
</body>
</html>
