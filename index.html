<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vượt Link4m Free V1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b111b;
            --card-bg: #151c27;
            --accent-blue: #00d4ff;
            --text-gray: #a0aab8;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-tag {
            background: rgba(0, 212, 255, 0.1);
            color: #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #4ade80;
            margin-bottom: 20px;
            display: inline-block;
        }

        .input-box {
            background: #0f1722;
            border: 1px solid #232d3d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            text-align: center;
            outline: none;
            font-size: 0.9rem;
        }

        .btn-paste {
            background: var(--accent-blue);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #result-area {
            display: none;
            margin-top: 15px;
            border-top: 1px solid #232d3d;
            padding-top: 15px;
        }

        .result-link-container {
            display: flex;
            align-items: center;
            background: #0f1722;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .result-link {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--accent-blue);
            font-size: 0.8rem;
        }

        .btn-visit {
            background: #2563eb;
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .instruction {
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="fas fa-bolt" style="color: var(--accent-blue);"></i>
        Vượt Link4m Free V1
    </div>

    <div class="status-tag">● Xác thực thành công</div>

    <div class="input-box">
        <input type="text" id="linkInput" placeholder="Dán link Link4m cần vượt...">
    </div>

    <button class="btn-paste" onclick="handleBypass()">
        <i class="fas fa-paste"></i> Dán link & Vượt
    </button>

    <div id="result-area">
        <div style="font-size: 0.8rem; color: var(--text-gray); margin-bottom: 5px;">Link đã vượt:</div>
        <div class="result-link-container">
            <span id="finalLink" class="result-link">Đang lấy link...</span>
            <i class="fas fa-copy" style="color: var(--accent-blue); cursor: pointer;" onclick="copyLink()"></i>
        </div>
        <a id="visitBtn" href="#" target="_blank" class="btn-visit">TRUY CẬP LINK</a>
    </div>

    <div class="instruction">
        <div style="color: orange; font-weight: bold; margin-bottom: 5px;">HƯỚNG DẪN:</div>
        01. Dán link cần vượt vào ô trên.<br>
        02. Đợi 2-3s để AI xử lý hệ thống.<br>
        03. Bấm "Truy cập link" để tới trang đích.
    </div>
</div>

<script>
    async function handleBypass() {
        const url = document.getElementById('linkInput').value;
        const resultArea = document.getElementById('result-area');
        const finalLinkTxt = document.getElementById('finalLink');
        const visitBtn = document.getElementById('visitBtn');

        if (!url) {
            alert("Vui lòng dán link!");
            return;
        }

        // Hiện thông báo đợi
        resultArea.style.display = 'block';
        finalLinkTxt.innerText = "Vui lòng đợi trong 2s-3s...";

        try {
            // Sử dụng một API Bypass trung gian (Ví dụ: bypass.city hoặc linkvertise bypasser)
            // Lưu ý: Bạn cần một backend hoặc dùng proxy để gọi API này
            const response = await fetch(`https://api.bypass.vip/bypass?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.status === "success") {
                setTimeout(() => {
                    finalLinkTxt.innerText = data.destination;
                    visitBtn.href = data.destination;
                }, 2000); // Giả lập xử lý 2s cho mượt
            } else {
                finalLinkTxt.innerText = "Lỗi: Link không hợp lệ hoặc không hỗ trợ.";
            }
        } catch (error) {
            // Demo nếu không có API thật, sẽ trả về kết quả sau 2s
            setTimeout(() => {
                finalLinkTxt.innerText = "https://trang-dich-cua-ban.com";
                visitBtn.href = "https://trang-dich-cua-ban.com";
            }, 2500);
        }
    }

    function copyLink() {
        const link = document.getElementById('finalLink').innerText;
        navigator.clipboard.writeText(link);
        alert("Đã sao chép link!");
    }
</script>

</body>
</html>
